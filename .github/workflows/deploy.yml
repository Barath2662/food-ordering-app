name: Deploy Food Ordering App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: node --check server.js

      - name: Create deployment package
        run: |
          zip -r food-ordering-app.zip \
            server.js \
            package.json \
            package-lock.json \
            public

      - name: Upload package to S3
        run: |
          aws s3 cp food-ordering-app.zip \
            "s3://elasticbeanstalk-${{ vars.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}/food-ordering/${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-label "food-ordering-${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-${{ vars.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }}",S3Key="food-ordering/${{ github.sha }}.zip" \
            --process

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "food-ordering-${{ github.sha }}"