name: Deploy Food Ordering App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials with OIDC
        id: aws_creds_oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # Step 3: Fallback to access keys if OIDC trust is not configured correctly
      - name: Configure AWS credentials with static keys fallback
        if: steps.aws_creds_oidc.outcome == 'failure' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 4: Stop early when no valid AWS authentication path is available
      - name: Validate AWS auth path
        if: steps.aws_creds_oidc.outcome == 'failure' && (secrets.AWS_ACCESS_KEY_ID == '' || secrets.AWS_SECRET_ACCESS_KEY == '')
        run: |
          echo "OIDC role assumption failed and fallback keys are not configured."
          echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets, or fix IAM OIDC trust for ${GITHUB_REPOSITORY}."
          exit 1

      # Step 5: Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 6: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 7: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 8: Validate the Node.js backend
      - name: Validate backend syntax
        run: node --check server.js

      # Step 9: Create deployment package
      - name: Create deployment package
        run: |
          zip -r food-ordering-app.zip \
            server.js \
            package.json \
            package-lock.json \
            public

      # Step 10: Upload package to the Elastic Beanstalk S3 bucket
      - name: Upload package to S3
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws s3 cp food-ordering-app.zip \
            "s3://elasticbeanstalk-${AWS_REGION}-${AWS_ACCOUNT_ID}/food-ordering/${GITHUB_SHA}.zip"

      # Step 11: Register a new application version
      - name: Create Elastic Beanstalk application version
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --version-label "food-ordering-${GITHUB_SHA}" \
            --source-bundle \
              S3Bucket="elasticbeanstalk-${AWS_REGION}-${AWS_ACCOUNT_ID}",S3Key="food-ordering/${GITHUB_SHA}.zip" \
            --process

      # Step 12: Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ vars.EB_APPLICATION_NAME }}" \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "food-ordering-${GITHUB_SHA}"

      # Step 13: Report successful deployment request
      - name: Report deployment
        run: |
          echo "Deployment request submitted successfully."
          echo "Application: ${{ vars.EB_APPLICATION_NAME }}"
          echo "Environment: ${{ vars.EB_ENVIRONMENT_NAME }}"
