<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Food Ordering System</h1>
        <p>Manage your restaurant menu and customer orders</p>
    </header>

    <main>
        <section>
            <h2>Add / Update Dish</h2>

            <form id="dishForm">
                <input type="hidden" id="dishId">

                <input
                    type="text"
                    id="dishName"
                    placeholder="Dish Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <select id="available">
                    <option value="1">Available</option>
                    <option value="0">Unavailable</option>
                </select>

                <button type="submit">Save Dish</button>
                <button type="button" id="cancelEdit">Cancel Edit</button>
            </form>
        </section>

        <section>
            <h2>Food Menu</h2>
            <div id="menuList"></div>
        </section>

        <section>
            <h2>Place Customer Order</h2>

            <form id="orderForm">
                <input
                    type="text"
                    id="customerName"
                    placeholder="Customer Name"
                    required
                >

                <select id="orderDish" required></select>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    max="100"
                    value="1"
                    required
                >

                <button type="submit">Place Order</button>
            </form>
        </section>

        <section>
            <h2>Customer Orders</h2>
            <div id="ordersList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
