
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Ordering System</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Food Ordering System</h1>
    <p>Manage your menu and customer orders</p>
    <p id="connectionStatus">Checking database connection...</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add Food Item</h2>

      <form id="foodForm">
        <input type="hidden" id="foodId">

        <label for="name">Food Name</label>
        <input id="name" required maxlength="100" placeholder="Chicken Burger">

        <label for="category">Category</label>
        <input id="category" required maxlength="60" placeholder="Burger">

        <label for="price">Price (₹)</label>
        <input id="price" type="number" min="0" step="0.01" required>

        <label for="description">Description</label>
        <textarea id="description" maxlength="500"></textarea>

        <label for="image">Image URL (optional)</label>
        <input id="image" type="url" placeholder="https://example.com/food.jpg">

        <label class="checkbox">
          <input id="available" type="checkbox" checked>
          Available for ordering
        </label>

        <button type="submit" id="saveButton">Add Food</button>
        <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
      </form>
      <p id="foodMessage" role="status"></p>
    </section>

    <section class="card">
      <h2>Food Menu</h2>
      <div id="foodList" class="food-grid">Loading food items...</div>
    </section>

    <section class="card">
      <h2>Place Customer Order</h2>

      <form id="orderForm">
        <label for="customerName">Customer Name</label>
        <input id="customerName" required maxlength="100">

        <label for="phone">Phone Number</label>
        <input id="phone" required maxlength="30">

        <label for="address">Delivery Address</label>
        <textarea id="address" required maxlength="500"></textarea>

        <label for="orderFood">Food Item</label>
        <select id="orderFood" required></select>

        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1" max="100" value="1" required>

        <button type="submit">Place Order</button>
      </form>
      <p id="orderMessage" role="status"></p>
    </section>

    <section class="card">
      <h2>Customer Orders</h2>
      <div id="orderList">Loading orders...</div>
    </section>
  </main>

  <footer>
    <p>Food Ordering System | Node.js, Express and MongoDB Atlas</p>
  </footer>
</body>
</html>
